name: Fork formatter one-shot

on:
  push:
    branches:
      - feat/macos-harness-release-gates

permissions:
  contents: write

concurrency:
  group: fork-formatter-final
  cancel-in-progress: true

jobs:
  format:
    if: github.repository == 'jameswright1562/t3code'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/macos-harness-release-gates
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          save-pnpm-store: "false"
      - name: Apply project formatter (lint is verified separately)
        run: vp check --fix || true
      - name: Commit format-only changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git -c core.hooksPath=/dev/null commit -m "style: normalize formatter output after lint fixes"
          git push origin HEAD:feat/macos-harness-release-gates
