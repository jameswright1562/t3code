name: Fork formatting one-shot

on:
  push:
    branches:
      - feat/macos-harness-release-gates

permissions:
  contents: write

concurrency:
  group: fork-format-one-shot
  cancel-in-progress: true

jobs:
  format:
    if: github.repository == 'jameswright1562/t3code'
    name: Apply repository formatter to PR branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted branch
        uses: actions/checkout@v4
        with:
          ref: feat/macos-harness-release-gates
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - name: Setup workspace
        uses: ./.github/actions/setup-ci-deps
        with:
          save-pnpm-store: "false"
      - name: Format repo
        run: vp check --fix || true # Formatter writes files even when separate lint rules fail
      - name: Commit formatter changes if any
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: apply repository formatter to harness PR"
          git push origin HEAD:feat/macos-harness-release-gates
